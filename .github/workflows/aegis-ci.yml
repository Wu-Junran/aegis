name: aegis-ci

on:
  pull_request:
    paths:
      - 'aegis/**'
      - 'aegis-mcp/**'
      - '.github/workflows/aegis-ci.yml'
  push:
    branches: [main]

jobs:
  test:
    name: Aegis tests + aegis-mcp tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.x'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aegis (TS) deps
        working-directory: aegis
        run: bun install --frozen-lockfile

      - name: Build aegis-mcp venv
        working-directory: aegis-mcp
        run: |
          python3.11 -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python -m spacy download en_core_web_sm

      - name: Aegis lint
        working-directory: aegis
        run: bun run lint

      - name: Aegis typecheck
        working-directory: aegis
        run: bun run typecheck

      - name: Aegis tests (TS — AEGIS_REQUIRE_MCP=1, required cassettes exercised)
        working-directory: aegis
        run: bun run test:ci

      - name: Aegis-mcp tests (Python)
        working-directory: aegis-mcp
        run: .venv/bin/pytest -v
