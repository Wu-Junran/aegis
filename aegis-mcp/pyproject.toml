[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "aegis-mcp"
version = "0.9.0"
description = "Aegis MCP server — FHIR, de-id, templates, clinical validation"
license = "Unlicense"
requires-python = ">=3.11"
dependencies = [
  "mcp >= 1.27",
  "fhir.resources >= 7",
  "jinja2 >= 3.1",
  "pyyaml >= 6",
  "presidio-analyzer >= 2.2",
  "presidio-anonymizer >= 2.2",
  "spacy >= 3.7",
]

[project.optional-dependencies]
dev = [
  "pytest >= 8",
  "pytest-asyncio >= 0.23",
]

[project.scripts]
aegis-mcp = "aegis_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
